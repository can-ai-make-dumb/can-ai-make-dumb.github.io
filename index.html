<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TestAI</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
</head>
<body>

  <header>
    <div class="logo">
      <svg class="logo-icon" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M20 2 L23 17 L38 20 L23 23 L20 38 L17 23 L2 20 L17 17 Z" fill="url(#starGrad)"/>
        <defs>
          <linearGradient id="starGrad" x1="2" y1="2" x2="38" y2="38" gradientUnits="userSpaceOnUse">
            <stop offset="0%" stop-color="#a855f7"/>
            <stop offset="100%" stop-color="#6366f1"/>
          </linearGradient>
        </defs>
      </svg>
      <span>TestAI</span>
    </div>
  </header>

  <main>
    <div class="chat-wrapper">
      <div class="chat-box" id="chatBox"></div>
      <div class="input-bar">
        <input type="text" id="userInput" placeholder="Ask me anything you want..." autocomplete="off" />
        <button id="sendBtn" aria-label="Send">
          <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M12 19V5M5 12l7-7 7 7" stroke="white" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </button>
      </div>
      <p class="disclaimer">AI can make mistakes, review content and check sources.</p>
    </div>
    <aside class="sidebar" id="sidebar"></aside>
  </main>

  <div class="maintenance-overlay" id="maintenanceOverlay">
    <div class="maintenance-card">
      <div class="maintenance-icon">
        <svg viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M24 4 L27 21 L44 24 L27 27 L24 44 L21 27 L4 24 L21 21 Z" fill="url(#mGrad)"/>
          <defs>
            <linearGradient id="mGrad" x1="4" y1="4" x2="44" y2="44" gradientUnits="userSpaceOnUse">
              <stop offset="0%" stop-color="#a855f7"/>
              <stop offset="100%" stop-color="#6366f1"/>
            </linearGradient>
          </defs>
        </svg>
      </div>
      <h1>We're deploying an Update!</h1>
      <p class="maintenance-sub">The AI isn't dumb, we're just improving your experience.</p>
      <p class="maintenance-eta">Estimated time: <span id="etaDisplay">--:--</span></p>
      <div class="progress-track">
        <div class="progress-bar" id="progressBar"></div>
      </div>
      <p class="maintenance-countdown">Back in <span id="countdownDisplay">--</span></p>
    </div>
  </div>

  <div class="pw-overlay" id="pwOverlay">
    <div class="pw-card">
      <div class="pw-lock">🔒</div>
      <p class="pw-title">Admin Access</p>
      <input
        type="password"
        id="pwInput"
        class="pw-input"
        placeholder="Password"
        autocomplete="off"
        maxlength="64"
      />
      <p class="pw-error" id="pwError"></p>
      <button class="pw-btn" id="pwSubmit">Unlock</button>
    </div>
  </div>

  <div class="admin-overlay" id="adminOverlay">
    <div class="admin-card">
      <div class="admin-header">
        <span class="admin-title">⚙️ Maintenance Control</span>
        <button class="admin-close" id="adminClose">✕</button>
      </div>
      <div class="admin-body">
        <label class="admin-label">Duration (minutes)</label>
        <div class="admin-duration-row">
          <button class="dur-btn" data-val="5">5 min</button>
          <button class="dur-btn" data-val="15">15 min</button>
          <button class="dur-btn" data-val="30">30 min</button>
          <button class="dur-btn" data-val="60">1 h</button>
        </div>
        <div class="admin-custom-row">
          <input type="number" id="customDuration" placeholder="Custom (min)" min="1" max="9999" />
        </div>
        <button class="admin-start-btn" id="adminStart">🚀 Start Maintenance</button>
        <button class="admin-stop-btn" id="adminStop" style="display:none">⛔ Stop Maintenance</button>
        <p class="admin-hint">Press <kbd>Ctrl</kbd>+<kbd>Shift</kbd>+<kbd>A</kbd> to open/close</p>
      </div>
    </div>
  </div>

  <script type="module" src="script.js"></script>
</body>
</html>
